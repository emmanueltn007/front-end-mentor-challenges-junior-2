<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Pricing Component</title>
</head>
<body>

    <!-- Background images -->
    <img class="bg-top" src="/images/bg-top.svg" alt="top background image">
    <img class="bg-bottom" src="/images/bg-bottom.svg" alt="bottom background image">

    <!-- Pricing Plan Toggle Switch -->
    <header>
        <h1>Our Pricing</h1>
        <div class="pricing-toggle-container">
            <span>Annually</span>
            <button class="toggle-button toggle-button-js">
                <svg class="toggle-image toggle-image-js" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640">
                    <path d="M416 192C486.7 192 544 249.3 544 320C544 390.7 486.7 448 416 448L224 448C153.3 448 96 390.7 96 320C96 249.3 153.3 192 224 192L416 192zM608 320C608 214 522 128 416 128L224 128C118 128 32 214 32 320C32 426 118 512 224 512L416 512C522 512 608 426 608 320zM224 400C268.2 400 304 364.2 304 320C304 275.8 268.2 240 224 240C179.8 240 144 275.8 144 320C144 364.2 179.8 400 224 400z" fill="currentColor" />
                </svg>
            </button>
            <span>Monthly</span>
        </div>
    </header>

    <!-- Pricing Plan Cards -->
    <main class="pricing-plans-container">
        <div class="basic-card">
            <h2>Basic</h2>
            <div class="price-container">
                <span class="dollar-sign">$</span>
                <span class="price basic-price-js"></span>
            </div>
            <div class="offers">
                <hr>
                <p>500 GB Storage</p>
                <hr>
                <p>2 Users allowed</p>
                <hr>
                <p>Send up to 3 GB</p>
                <hr>
            </div>
            <button>
                LEARN MORE
            </button>
        </div>
        <div class="professional-card">
            <h2>Professional</h2>
            <div class="price-container">
                <span class="dollar-sign">$</span>
                <span class="price professional-price-js"></span>
            </div>
            <div class="offers">
                <hr>
                <p>1 TB Storage</p>
                <hr>
                <p>5 Users allowed</p>
                <hr>
                <p>Send up to 10 GB</p>
                <hr>
            </div>
            <button>
                LEARN MORE
            </button>
        </div>
        <div class="master-card">
            <h2>Master</h2>
            <p class="price-container">
                <span class="dollar-sign">$</span>
                <span class="price master-price-js"></span>
            </p>
            <div class="offers">
                <hr>
                <p>2 TB Storage</p>
                <hr>
                <p>10 Users allowed</p>
                <hr>
                <p>Send up to 20 GB</p>
                <hr>
            </div>
            <button>
                LEARN MORE
            </button>
        </div>
    </main>
    
    <script src="script.js"></script>
</body>
</html>
