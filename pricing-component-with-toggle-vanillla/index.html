<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Pricing Component</title>
</head>
<body>
    <header>
        <h1>Our Pricing</h1>
        <div>
            <span>Annually</span>
            <button>
                <img src="/images/toggle-off-solid-full.svg" alt="toggle switch">
            </button>
            <span>Monthly</span>
        </div>
    </header>
    <main>
        <div class="basic-card">
            <h2>Basic</h2>
            <p class="price">
                <span>$</span>
                249.99
            </p>
            <hr>
            <p>500 GB Storage</p>
            <hr>
            <p>2 Users allowed</p>
            <hr>
            <p>Send up to 3 GB</p>
            <hr>
            <button>
                LEARN MORE
            </button>
        </div>
        <div class="professional-card">
            <h2>Professional</h2>
            <p class="price">
                <span>$</span>
                199.99
            </p>
            <hr>
            <p>1 TB Storage</p>
            <hr>
            <p>5 Users allowed</p>
            <hr>
            <p>Send up to 10 GB</p>
            <hr>
            <button>
                LEARN MORE
            </button>
        </div>
        <div class="master-card">
            <h2>Master</h2>
            <p class="price">
                <span>$</span>
                399.99
            </p>
            <hr>
            <p>2 TB Storage</p>
            <hr>
            <p>10 Users allowed</p>
            <hr>
            <p>Send up to 20 GB</p>
            <hr>
            <button>
                LEARN MORE
            </button>
        </div>
    </main>
    
    <script src="script.js"></script>
</body>
</html>
